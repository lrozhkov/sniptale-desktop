{
  "name": "Build alpha installer",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "tag": {
          "description": "Alpha tag matching Cargo version (v0.X.Y-alpha.N)",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "qa": {
      "uses": "./.github/workflows/checks.yml"
    },
    "package": {
      "needs": "qa",
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "windows-2022",
      "timeout-minutes": 45,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.15.2"
          }
        },
        {
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "qa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": ".tmp/release/alpha-proof"
          }
        },
        {
          "name": "Identify Windows build image",
          "id": "build-image",
          "shell": "pwsh",
          "run": "if (-not $env:ImageVersion) { throw \"runner image identity missing\" }; \"version=$env:ImageVersion\" >> $env:GITHUB_OUTPUT"
        },
        {
          "name": "Cache compiled Windows dependencies",
          "uses": "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "path": "target",
            "key": "windows-msvc-static-v1-${{ steps.build-image.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs', 'rust-toolchain.toml', '.cargo/**', 'resources/**', 'tooling/configs/qa/tool-versions.json', 'tooling/configs/qa/toolchain-lock.json', 'tooling/release/windows/toolchain.ps1', 'tooling/release/windows/alpha-package.ps1') }}"
          }
        },
        {
          "name": "Build exact alpha package",
          "shell": "pwsh",
          "env": {
            "ALPHA_TAG": "${{ inputs.tag }}"
          },
          "run": "& tooling/release/windows/alpha-package.ps1 -QaProof .tmp/release/alpha-proof -Tag $env:ALPHA_TAG"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "alpha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": ".tmp/release/alpha",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
