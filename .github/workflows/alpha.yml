{
  "name": "Build alpha installer",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "tag": {
          "description": "Alpha tag matching Cargo version (v0.X.Y-alpha.N)",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "qa": {
      "uses": "./.github/workflows/checks.yml"
    },
    "package": {
      "needs": "qa",
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "windows-2022",
      "timeout-minutes": 45,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12.10"
          }
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "qa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": ".tmp/release/alpha-proof"
          }
        },
        {
          "name": "Build exact alpha package",
          "shell": "pwsh",
          "env": {
            "ALPHA_TAG": "${{ inputs.tag }}"
          },
          "run": "& tooling/release/windows/alpha-package.ps1 -QaProof .tmp/release/alpha-proof -Tag $env:ALPHA_TAG"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "alpha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": ".tmp/release/alpha",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
