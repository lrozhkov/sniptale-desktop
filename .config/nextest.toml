[profile.default]
retries = 0
fail-fast = false
status-level = "pass"
final-status-level = "slow"
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

# The real one-hour producer/encryption/framing proof takes about 188s in a debug build.
[[profile.default.overrides]]
filter = "test(=app::bridge::attachments::tests::a_full_hour_survives_protected_storage_paged_manifests_and_native_host_framing)"
slow-timeout = { period = "120s", terminate-after = 3 }
